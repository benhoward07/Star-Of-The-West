<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Illustration of a paddlewheel steamship at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12122a"/>
      <stop offset="1" stop-color="#2f3a6e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5f73"/>
      <stop offset="1" stop-color="#10283f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="40" cy="30" r="1.4"/><circle cx="95" cy="58" r="1"/><circle cx="150" cy="22" r="1.6"/>
    <circle cx="215" cy="46" r="1"/><circle cx="262" cy="18" r="1.3"/><circle cx="330" cy="62" r="1"/>
    <circle cx="372" cy="28" r="1.5"/><circle cx="20" cy="88" r="1"/><circle cx="300" cy="96" r="1.1"/>
  </g>
  <polygon points="0,-13 3.1,-4.2 12.4,-4 5,1.6 7.6,10.6 0,5.200 -7.6,10.6 -5,1.6 -12.4,-4 -3.1,-4.200" transform="translate(338 44)" fill="#ffd700"/>
  <!-- smoke -->
  <g fill="#8d93b8" opacity="0.55">
    <circle cx="196" cy="62" r="13"/><circle cx="174" cy="46" r="16"/><circle cx="146" cy="34" r="19"/><circle cx="112" cy="26" r="15"/>
  </g>
  <!-- masts and rigging -->
  <g stroke="#c9cde6" stroke-width="2.5" stroke-linecap="round">
    <path d="M112 152V78M292 152V84"/>
    <path d="M112 82 66 150M112 82l52 68M292 88l-46 62M292 88l44 60" stroke-width="1" opacity="0.7"/>
  </g>
  <path d="M292 86h26l-7 7 7 7h-26z" fill="#6ae5e0"/>
  <!-- funnel -->
  <rect x="190" y="78" width="20" height="74" fill="#23234a" stroke="#c9cde6" stroke-width="2"/>
  <rect x="190" y="86" width="20" height="10" fill="#ffd700"/>
  <!-- deck house -->
  <rect x="138" y="134" width="126" height="20" rx="3" fill="#c9cde6"/>
  <g fill="#23234a"><rect x="148" y="140" width="9" height="8"/><rect x="164" y="140" width="9" height="8"/><rect x="232" y="140" width="9" height="8"/><rect x="248" y="140" width="9" height="8"/></g>
  <!-- hull -->
  <path d="M40 152h320l-22 36H70z" fill="#1a1a2e" stroke="#c9cde6" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M52 164h296" stroke="#6ae5e0" stroke-width="2.5"/>
  <!-- paddle wheel -->
  <path d="M158 190a42 42 0 0 1 84 0z" fill="#2c2c5a" stroke="#ffd700" stroke-width="3"/>
  <g stroke="#ffd700" stroke-width="2.5" stroke-linecap="round">
    <path d="M200 190v-38M200 190l-27-27M200 190l27-27M200 190l-37-10M200 190l37-10"/>
  </g>
  <circle cx="200" cy="188" r="6" fill="#ffd700"/>
  <!-- water -->
  <rect y="186" width="400" height="54" fill="url(#sea)"/>
  <g fill="none" stroke="#6ae5e0" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M0 198c14-9 26-9 40 0s26 9 40 0 26-9 40 0 26 9 40 0 26-9 40 0 26 9 40 0 26-9 40 0 26 9 40 0 26-9 40 0 26 9 40 0"/>
    <path d="M-20 218c14-9 26-9 40 0s26 9 40 0 26-9 40 0 26 9 40 0 26-9 40 0 26 9 40 0 26-9 40 0 26 9 40 0 26-9 40 0 26 9 40 0 26-9 40 0" opacity="0.5"/>
  </g>
</svg>
