<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Illustration of a cannon on a sandy shore at dawn with a ship on the horizon">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="0.6" stop-color="#4a3f73"/>
      <stop offset="1" stop-color="#e58f6b"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79a6a"/>
      <stop offset="1" stop-color="#7c6442"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#dawn)"/>
  <circle cx="318" cy="150" r="26" fill="#ffd700" opacity="0.9"/>
  <!-- sea -->
  <rect y="150" width="400" height="40" fill="#1f5f73"/>
  <g fill="none" stroke="#6ae5e0" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M200 162h60M280 170h70M150 174h50M300 158h46"/>
  </g>
  <!-- distant ship -->
  <g transform="translate(250 128)" fill="#12122a">
    <path d="M0 16h64l-6 9H8z"/>
    <rect x="28" y="2" width="6" height="15"/>
    <path d="M12 16V-2M52 16V0" stroke="#12122a" stroke-width="2"/>
    <circle cx="26" cy="-4" r="5" opacity="0.5"/><circle cx="18" cy="-10" r="6" opacity="0.4"/>
  </g>
  <!-- dune -->
  <path d="M0 240V176c50-18 110-22 170-12s120 22 230 6v70z" fill="url(#sand)"/>
  <!-- muzzle smoke -->
  <g fill="#e8eaf6" opacity="0.8">
    <circle cx="238" cy="118" r="12"/><circle cx="256" cy="108" r="15"/><circle cx="276" cy="116" r="10"/><circle cx="262" cy="126" r="9"/>
  </g>
  <polygon points="0,-9 2.1,-2.900 8.6,-2.8 3.5,1.100 5.300,7.300 0,3.600 -5.300,7.300 -3.5,1.100 -8.6,-2.8 -2.1,-2.900" transform="translate(232 120)" fill="#ffd700"/>
  <!-- cannon -->
  <g transform="rotate(-14 130 160)">
    <rect x="96" y="144" width="132" height="24" rx="10" fill="#23234a" stroke="#c9cde6" stroke-width="2.5"/>
    <rect x="218" y="140" width="12" height="32" rx="4" fill="#23234a" stroke="#c9cde6" stroke-width="2.5"/>
    <circle cx="94" cy="156" r="9" fill="#23234a" stroke="#c9cde6" stroke-width="2.5"/>
    <rect x="150" y="144" width="6" height="24" fill="#ffd700"/>
  </g>
  <!-- carriage -->
  <path d="M84 176h104l-10 22H74z" fill="#5a3f2a" stroke="#2c1e12" stroke-width="2"/>
  <g fill="#2c1e12" stroke="#c9a56b" stroke-width="4">
    <circle cx="98" cy="202" r="15"/><circle cx="170" cy="202" r="15"/>
  </g>
  <g fill="#c9a56b"><circle cx="98" cy="202" r="3"/><circle cx="170" cy="202" r="3"/></g>
  <!-- cannon balls -->
  <g fill="#12122a"><circle cx="214" cy="212" r="8"/><circle cx="230" cy="212" r="8"/><circle cx="222" cy="199" r="8"/></g>
</svg>
