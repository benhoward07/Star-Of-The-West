<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Stylized illustration of a stone monument with a star on a parade field">
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23234a"/>
      <stop offset="1" stop-color="#3f7f9a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dcee"/>
      <stop offset="1" stop-color="#9aa0c0"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fae7b"/>
      <stop offset="1" stop-color="#1f6b4a"/>
