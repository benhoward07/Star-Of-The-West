  <polygon points="0,-22 5.2,-7.1 20.900,-6.8 8.4,2.7 12.900,17.8 0,8.8 -12.900,17.8 -8.4,2.7 -20.900,-6.8 -5.2,-7.1" transform="translate(214 96)" fill="#ffd700" stroke="#b8860b" stroke-width="1.500"/>
  <g stroke="#6f7596" stroke-width="2.500" stroke-linecap="round" opacity="0.8">
