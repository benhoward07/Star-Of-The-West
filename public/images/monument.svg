    <path d="M0 172v-34h14v-8h10v8h30v-8h10v8h30v-8h10v8h16v34z"/>
    <path d="M280 172v-34h14v-8h10v8h30v-8h10v8h30v-8h10v8h16v34z"/>
  </g>
  <rect y="170" width="400" height="70" fill="url(#grass)"/>
